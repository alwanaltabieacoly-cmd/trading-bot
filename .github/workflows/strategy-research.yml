name: Strategy research

# Runs the strategy research harness every 4 hours. This works with the
# PC switched off - GitHub runs it on their runners.
#
# On a PUBLIC repository GitHub Actions minutes are unlimited, so a
# 6x/day cadence costs nothing.
#
# The job only ever READS market data and WRITES reports. It never places
# an order, never touches exchange credentials, and never touches money.
# The paper-trading bot runs separately on an always-on machine.

on:
  schedule:
    # Every 4 hours, on an off-round minute so the job does not sit in
    # GitHub's cron pile-up. That is 06:17, 10:17, 14:17, 18:17, 22:17,
    # 02:17 UTC.
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: "Use cached data instead of fetching fresh candles"
        type: boolean
        default: false

concurrency:
  group: strategy-research
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas numpy pyarrow

      - name: Run research
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          if [ "${{ inputs.skip_fetch }}" = "true" ]; then
            python -m research.run_daily --no-fetch
          else
            python -m research.run_daily
          fi

      - name: Deep analysis across all runs
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m research.analyze

      - name: Commit report and state
        run: |
          git config user.name "research-bot"
          git config user.email "research-bot@users.noreply.github.com"
          git add research/reports research/state research/data
          git add research/history.csv research/deep-report.md research/deep-report.json
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "research: run $(date -u +%Y-%m-%d_%H%M)"
            git push
          fi

      - name: Summary
        run: |
          echo "### Research run complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, os, glob
          state = json.load(open("research/state/champion.json"))
          champ = state.get("champion") or {}
          print(f"**Champion:** `{champ.get('id', 'none')}`")
          print(f"- holdout CAGR: {champ.get('holdout_cagr', 'n/a')}%")
          print(f"- holdout max drawdown: {champ.get('holdout_dd', 'n/a')}%")
          print(f"- assets positive: {champ.get('assets_positive', 'n/a')}")
          ch = state.get("challenger")
          if ch:
              print("")
              print(f"**Challenger (awaiting paper confirmation):** `{ch.get('id')}`")
              print(f"- holdout CAGR: {ch.get('holdout_cagr', 'n/a')}%")
          print("")
          print(f"- cumulative candidates tested: {state.get('cumulative_candidates_tested', 'n/a')}")
          if os.path.exists("research/deep-report.json"):
              d = json.load(open("research/deep-report.json"))
              se = d.get("selection_efficiency", {})
              print(f"- runs analysed: {d.get('n_runs', 'n/a')}")
              print(f"- selection efficiency (rank corr): {se.get('mean_rank_correlation', 'n/a')}"
                    f" -> {se.get('verdict', 'n/a')}")
          PY
