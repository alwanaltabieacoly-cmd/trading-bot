name: Daily research

# Runs the strategy research harness on a schedule. This works with the
# PC switched off - GitHub runs it on their runners.
#
# The job only ever READS market data and WRITES reports. It never places
# an order, never touches exchange credentials, and never touches money.
# The paper-trading bot runs separately on an always-on machine.

on:
  schedule:
    # 06:17 UTC daily. An off-round minute avoids the GitHub cron pile-up
    # that makes scheduled jobs start late.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: "Use cached data instead of fetching fresh candles"
        type: boolean
        default: false

concurrency:
  group: daily-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas numpy pyarrow

      - name: Run daily research
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          if [ "${{ inputs.skip_fetch }}" = "true" ]; then
            python -m research.run_daily --no-fetch
          else
            python -m research.run_daily
          fi

      - name: Commit report and state
        run: |
          git config user.name "opencode-research-bot"
          git config user.email "opencode-research-bot@users.noreply.github.com"
          git add research/reports research/state research/data
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "research: daily run $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Summary
        run: |
          echo "### Daily research complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "research/state/champion.json" ]; then
            python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, os
          state = json.load(open("research/state/champion.json"))
          champ = state.get("champion") or {}
          print(f"**Champion:** `{champ.get('id', 'none')}`")
          print(f"- holdout CAGR: {champ.get('holdout_cagr', 'n/a')}%")
          print(f"- holdout max drawdown: {champ.get('holdout_dd', 'n/a')}%")
          print(f"- assets positive: {champ.get('assets_positive', 'n/a')}")
          ch = state.get("challenger")
          if ch:
              print("")
              print(f"**Challenger awaiting paper confirmation:** `{ch.get('id')}`")
              print(f"- holdout CAGR: {ch.get('holdout_cagr', 'n/a')}%")
          PY
          fi
